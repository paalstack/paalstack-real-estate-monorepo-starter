name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# (Hardening fix: /): workflows moved from apps/web/.github to the
# repo root (GitHub only reads root workflows in a monorepo) and repaired:
#   - .nvmrc replaced by node-version from package.json engines
#   - format:check / test:coverage referenced scripts that didn't exist
#   - RLS matrix: CI provisions Postgres + applies the init migration, and the
#     never-skip guard makes a missing DB a FAILURE, not a silent skip
# CI never talks to a real provider — placeholder-shaped vars only.
#
#  (first green effort): the generated Prisma client is gitignored
# by design, so every job that compiles/imports @starter/database sources
# must run `prisma generate` first. The RLS matrix also bootstraps the
# non-owner role `starter_app` (normally created by docker/postgres-init/
# 00-init.sql on volume init — CI's service container has no entrypoint
# hook) BEFORE prisma migrate deploy, because migration 1 GRANTs to it.
env:
  SKIP_ENV_VALIDATION: 'true'
  NODE_ENV: test
  NEXT_PUBLIC_API_BASE_URL: https://api.example.com/v1
  NEXT_PUBLIC_APP_NAME: Starter
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_DEBUG_MODE: false

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @starter/database generate
      - run: pnpm type-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @starter/database generate
      - run: pnpm lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @starter/database generate
      # Backend has ZERO tests until T-RLSREAL lands — keep passWithNoTests
      # true for now so bundle-1 fixes can ship; the plan flips it to false
      # in the same PR as the first real backend test ().
      - run: pnpm test

  rls-matrix:
    name: RLS Isolation Matrix
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter
          POSTGRES_DB: starter_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter -d starter_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 00-init.sql equivalent: CI's bare postgres container has no
      # docker-entrypoint hook, so create the non-owner app role here
      # () BEFORE migrations — migration 1's policy block GRANTs to it.
      # Heredoc-quoting on purpose: $$ in YAML run-blocks gets shell-expanded
      # (\$\$ landed as the runner PID last run -> 'unterminated dollar-quoted
      # string'). Fresh container per run, so no IF NOT EXISTS needed.
      - run: |
          docker exec -i "$(docker ps -qf name=postgres)" psql -U starter -d starter_crm <<'SQL'
          CREATE ROLE starter_app LOGIN PASSWORD 'starter' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          SQL
      - run: pnpm --filter @starter/database generate
      # 00-init.sql equivalent + schema + policies + FORCE + grants
      - run: cd packages/database && npx prisma migrate deploy
        env:
          DIRECT_DATABASE_URL: postgresql://starter:starter@localhost:5432/starter_crm?schema=public
      # : the matrix FAILS if the DB is unreachable — a missing
      # DATABASE_URL must never silently skip the security suite.
      - run: cd packages/database && pnpm test
        env:
          # Both URLs: DIRECT for migrate; DATABASE for the runtime adapter
          # (src/index.ts reads DATABASE_URL — Prisma 7 pg-adapter client).
          DIRECT_DATABASE_URL: postgresql://starter:starter@localhost:5432/starter_crm?schema=public
          DATABASE_URL: postgresql://starter:starter@localhost:5432/starter_crm?schema=public
          RLS_MATRIX_REQUIRED: 'true'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [type-check, lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @starter/database generate
      # (build) — Run turbo with --concurrency=1 so workspace package
      # builds (database, auth, offline-store, api-types) complete fully
      # before the consuming apps (backend, web) start their tsc.
      #
      # Default turbo concurrency is 10, which schedules dependent tasks
      # to start as soon as a dep is *scheduled* rather than *finished*.
      # On this monorepo that means apps/web's `nest build` (or
      # `next build`) can start while @starter/auth's `tsc` is still
      # running, erroring with TS2307 "Cannot find module '@starter/auth'"
      # because the dist isn't on disk yet. Serial execution forces the
      # topological order to be honored.
      #
      # Cost: 2m on a fresh runner vs ~15s with concurrency=10 on local
      # dev. CI accepts that cost; the bug it avoids is a hard failure.
      - run: pnpm exec turbo run build --concurrency=1