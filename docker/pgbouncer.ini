; PgBouncer config for Real Estate Starter.
; Pool-mode requirement: pool_mode MUST be 'session' (transaction breaks RLS).

[databases]
starter_crm = host=postgres port=5432 dbname=starter_crm auth_user=starter

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Pool-mode requirement: REQUIRED for RLS. Transaction pooling silently breaks
; per-request SET LOCAL session variables.
pool_mode = session

max_client_conn = 1000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
server_idle_timeout = 600
server_lifetime = 3600
